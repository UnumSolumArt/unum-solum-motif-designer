[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run vite"
  targetPort = 5173
  port = 8888
  framework = "#custom"
  autoLaunch = false

[[redirects]]
  from = "/api/solve/*"
  to = "/.netlify/functions/solve/:splat"
  status = 200

[[redirects]]
  from = "/api/solve"
  to = "/.netlify/functions/solve"
  status = 200
